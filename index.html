<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>AI Recipe Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Make breakfast using 3-ingredients</h1>
      </header>

      <main>
        <form id="recipe-form" class="recipe-form">
          <input
            type="text"
            placeholder="Enter 1 Ingredient"
            class="recipes-input"
            autofocus
            autocomplete="off"
            id="user-input"
            required
          />
          <input type="submit" class="submit-input" />
        </form>
        <div class="recipe" id="recipe"></div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/Andile763" target="_blank">Mishell</a> and
        is open-sourced
        <a
          href="https://github.com/Andile763/breakfast-recipe-generator"
          target="_blank"
          >on GitHub</a
        >
        and is
        <a
          href="https://ai-breakfast-recipe-generator.netlify.app/"
          target="_blank"
          >hosted on Netlify.</a
        >
      </footer>
    </div>

    <script src="src/script.js"></script>
  </body>
</html>
